name: Collect Kenyan search trends

on:
  schedule:
    # Minute 17 avoids the busiest top-of-hour period for scheduled workflows.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-kenyan-search-trends
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Choose collection phase
        id: phase
        shell: bash
        run: |
          now=$(date -u +%s)
          # 1 July 2026 00:00 in Nairobi is 30 June 2026 21:00 UTC.
          cutoff=$(date -u -d "2026-06-30T21:00:00Z" +%s)
          if [ "$now" -lt "$cutoff" ]; then
            echo "collect=true" >> "$GITHUB_OUTPUT"
            echo "analyze=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f reports/2026-06-collection.md ]; then
            echo "collect=false" >> "$GITHUB_OUTPUT"
            echo "analyze=true" >> "$GITHUB_OUTPUT"
          else
            echo "collect=false" >> "$GITHUB_OUTPUT"
            echo "analyze=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect current trends
        if: steps.phase.outputs.collect == 'true'
        env:
          PYTHONPATH: src
        run: python -m kenya_search.cli ingest

      - name: Build final statistical report
        if: steps.phase.outputs.analyze == 'true'
        env:
          PYTHONPATH: src
        run: python -m kenya_search.cli analyze --output reports/2026-06-collection.md

      - name: Persist new data
        if: steps.phase.outputs.collect == 'true' || steps.phase.outputs.analyze == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/search_behaviour.db data/raw
          if [ -f reports/2026-06-collection.md ]; then
            git add reports/2026-06-collection.md
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: collect Kenyan search trends"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

